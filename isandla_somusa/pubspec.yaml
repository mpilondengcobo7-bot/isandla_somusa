name: isandla_somusa
description: Isandla Somusa - The Helping Hand. A food donation app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - updated to compatible versions
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.1.6

  # State management
  provider: ^6.1.1

  # UI
  material_color_utilities: ^0.13.0
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Image handling
  image_picker: ^1.0.7

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  crypto: ^3.0.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
